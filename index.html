    <link rel="icon" href="favicon/favicon.ico">
</head>

<body>
    <div class="intro-screen">
        <div class="quiz-app"><h2>Quiz App</h2></div>
    </div>
    <nav class="navbar bg-secondary">
        <div class="container-fluid d-flex justify-content-center align-items-center ">
            <a class="navbar-brand text-white fs-2 d-flex justify-content-center align-items-center gap-2" href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor"
                    class="bi bi-code-slash border rounded-2" viewBox="0 0 16 16">
                    <path
                        d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0m6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0" />
                </svg>
                Quiz App
            </a>
        </div>
    </nav>

    <div class="container content py-4 fs-5">
        <h2 class="question-no">Question 1 of 10</h2>
        <div class="progress quiz-progress rounded-5 apple-glass" role="progressbar" aria-label="Example 20px high"
        aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 20px">
        <div class="progress-bar " style="width: 0%"></div>
    </div>
    <h3 class="py-4 question-text">What does html stand for?</h3>
    <div class="option">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="optionA" value="A">
                <label class="form-check-label" for="optionA">
                    A. Hyper Text Markup Language
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="optionB" value="B">
                <label class="form-check-label" for="optionB">
                    B. High Text Machine Language
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="optionC" value="C">
                <label class="form-check-label" for="optionC">
                    C. Hyperlink Text Management
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="optionD" value="D">
                <label class="form-check-label" for="optionD">
                    D. Home Tool Markup Language
                </label>
            </div>
        </div>
        <div class="error text-danger"></div>
        <div class="container d-flex justify-content-between">
            <button type="button" class="btn btn-primary my-4 back-btn">Back</button>
            <button type="button" class="btn btn-success my-4 next-btn">Next</button>
        </div>
        <div class="container apple-glass score-div">
            <h4 class="text-center score">Score: 0 / 10</h4>
        </div>
    </div>
    <div class="submit-page d-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" fill="currentColor" class="bi bi-patch-check-fill my-4" viewBox="0 0 16 16">
  <path class="check-bg" d="M10.067.87a2.89 2.89 0 0 0-4.134 0l-.622.638-.89-.011a2.89 2.89 0 0 0-2.924 2.924l.01.89-.636.622a2.89 2.89 0 0 0 0 4.134l.637.622-.011.89a2.89 2.89 0 0 0 2.924 2.924l.89-.01.622.636a2.89 2.89 0 0 0 4.134 0l.622-.637.89.011a2.89 2.89 0 0 0 2.924-2.924l-.01-.89.636-.622a2.89 2.89 0 0 0 0-4.134l-.637-.622.011-.89a2.89 2.89 0 0 0-2.924-2.924l-.89.01z"/>
  <path class="check" d="M10.354 6.854l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7 8.793l2.646-2.647a.5.5 0 0 1 .708.708"/>
</svg>

        <div>Quiz Completed! 🎉</div>
        <div class="show-score"></div>
        <button class="btn btn-warning btn-lg restart-quiz">
            Restart Quiz
        </button>
    </div>
